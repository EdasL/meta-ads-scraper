# Local-test stack ONLY (Plan 3). Production stack is ops/docker-compose.yml (Plan 7).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agf
      POSTGRES_PASSWORD: agf
      POSTGRES_DB: agf
    ports:
      - "5433:5432"           # 5433 on host to avoid clashing with a local PG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agf"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"           # S3 API
      - "9011:9011"           # console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
