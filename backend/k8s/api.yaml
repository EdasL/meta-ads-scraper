# Media reads use ADC via Workload Identity — no MINIO/HMAC keys needed (Task 2: storage.go:35-42).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agf-api
  namespace: agf
  annotations:
    iam.gke.io/gcp-service-account: agf-api@peon-489013.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agf-api
  namespace: agf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agf-api
  template:
    metadata:
      labels:
        app: agf-api
    spec:
      serviceAccountName: agf-api
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          args:
            - "--structured-logs"
            - "--address=127.0.0.1"
            - "--port=5432"
            - "peon-489013:europe-west1:agf-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
        - name: api
          image: europe-west1-docker.pkg.dev/peon-489013/agf/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: agf-secrets
          env:
            - name: GIN_MODE
              value: "release"
            - name: PORT
              value: "8000"
            - name: AGF_CORS_ORIGINS
              value: "https://peon.works,https://app.peon.works"
            - name: S3_ENDPOINT
              value: "https://storage.googleapis.com"
            - name: S3_BUCKET
              value: "agf-media-peon-489013"
            - name: S3_REGION
              value: "europe-west1"
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "1000m" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agf-api
  namespace: agf
  annotations:
    cloud.google.com/backend-config: '{"default": "agf-backend-config"}'
spec:
  selector:
    app: agf-api
  ports:
    - port: 8000
      targetPort: 8000
