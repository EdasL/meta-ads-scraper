# Field Desk — PROD on peon-489013 (europe-west1). Worker/minio/cron only;
# Postgres is Cloud SQL (reached via the cloud-sql-proxy sidecar), API/web stay
# on the Mac. Image is built by Cloud Build → Artifact Registry (ops/prod, Task 2).
name: field-desk-prod

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    # On the VM the proxy uses the instance service account (ADC) — no key file.

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...'; sleep 2; done &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready';"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

  worker:
    image: europe-west1-docker.pkg.dev/peon-489013/agf/worker:latest
    restart: unless-stopped
    command: python -m agf.workers.main
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      # Sweep cadence: DAILY, not every tick. The fixed ~301-keyword set is rested-
      # depleted (probe 2026-07-02: re-sweeping crashed new/kw 1.43->0.002 in 2 days;
      # last 7d = 321 SERP requests per new find, ~99.7% of budget re-confirming known
      # ads). continuous=0 gates the sweep to one finished sweep_runs row/day while the
      # loop still ticks hourly, so enrich/repair/store-refresh keep their ~current rate.
      # See docs/research/2026-07-02-novel-discovery-algorithm.md.
      AGF_CONTINUOUS_DISCOVERY: ${AGF_CONTINUOUS_DISCOVERY:-0}
      AGF_SWEEP_PAGES: ${AGF_SWEEP_PAGES:-4}
      AGF_KW_DELAY: ${AGF_KW_DELAY:-3.0}
      AGF_DISCOVERY_ENRICH_BUDGET: ${AGF_DISCOVERY_ENRICH_BUDGET:-600}
      AGF_SCORE_AFTER_SWEEP: ${AGF_SCORE_AFTER_SWEEP:-1}
      AGF_SWEEP_INTERVAL_SEC: ${AGF_SWEEP_INTERVAL_SEC:-3600}
      AGF_FLYWHEEL_EVERY_SEC: ${AGF_FLYWHEEL_EVERY_SEC:-7200}
      AGF_RELEASE_MINT: ${AGF_RELEASE_MINT:-1}
      AGF_RELEASE_MINT_MAX_LISTINGS: ${AGF_RELEASE_MINT_MAX_LISTINGS:-40}
    healthcheck:
      test: ["CMD", "python", "-m", "agf.workers.main", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  cron:
    image: europe-west1-docker.pkg.dev/peon-489013/agf/worker:latest
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "env >> /etc/environment && crontab /app/ops/prod/crontab && cron -f"
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
    depends_on:
      cloud-sql-proxy:
        condition: service_started

volumes:
  minio_data:
