# Field Desk — PROD on peon-489013 (europe-west1). Worker/minio/cron only;
# Postgres is Cloud SQL (reached via the cloud-sql-proxy sidecar), API/web stay
# on the Mac. Image is built by Cloud Build → Artifact Registry (ops/prod, Task 2).
name: field-desk-prod

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    # On the VM the proxy uses the instance service account (ADC) — no key file.

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...'; sleep 2; done &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready';"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

  worker:
    image: europe-west1-docker.pkg.dev/peon-489013/agf/worker:latest
    restart: unless-stopped
    # init is load-bearing: without it the worker is PID 1, so (a) the watchdog's
    # self-SIGKILL is ignored by the kernel (unhandled fatal signals never reach
    # PID 1 from its own namespace) and a wedged worker stays wedged forever, and
    # (b) orphaned chromium/node helpers are never reaped (1,556 zombies in 15h
    # on 2026-07-07).
    init: true
    command: python -m agf.workers.main
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      # Sweep cadence: DAILY, not every tick. The fixed ~301-keyword set is rested-
      # depleted (probe 2026-07-02: re-sweeping crashed new/kw 1.43->0.002 in 2 days;
      # last 7d = 321 SERP requests per new find, ~99.7% of budget re-confirming known
      # ads). continuous=0 gates the sweep to one finished sweep_runs row/day while the
      # loop still ticks hourly, so enrich/repair/store-refresh keep their ~current rate.
      # See docs/research/2026-07-02-novel-discovery-algorithm.md.
      AGF_CONTINUOUS_DISCOVERY: ${AGF_CONTINUOUS_DISCOVERY:-0}
      AGF_SWEEP_PAGES: ${AGF_SWEEP_PAGES:-4}
      # Intra-sweep concurrency: the one daily sweep is fanned over K workers, each
      # its own warm session + proxy (run_parallel_sweep). Does NOT change re-sweep
      # cadence. 3 = DataImpulse-proven concurrency; drop to 2 via .env if rd_challenge
      # rates climb. See docs/superpowers/specs/2026-07-10-concurrent-sweep-design.md.
      AGF_SWEEP_WORKERS: ${AGF_SWEEP_WORKERS:-3}
      AGF_KW_DELAY: ${AGF_KW_DELAY:-3.0}
      AGF_DISCOVERY_ENRICH_BUDGET: ${AGF_DISCOVERY_ENRICH_BUDGET:-600}
      AGF_SWEEP_INTERVAL_SEC: ${AGF_SWEEP_INTERVAL_SEC:-3600}
      AGF_FLYWHEEL_EVERY_SEC: ${AGF_FLYWHEEL_EVERY_SEC:-7200}
      AGF_RELEASE_MINT: ${AGF_RELEASE_MINT:-1}
      AGF_FRAME_MINT_K: ${AGF_FRAME_MINT_K:-15}
      AGF_FRAME_MINT_FLOOR: ${AGF_FRAME_MINT_FLOOR:-5}
      AGF_FRAME_MINT_SLOTS: ${AGF_FRAME_MINT_SLOTS:-40}
      AGF_FRAME_MINT_MIN_ADVERTISERS: ${AGF_FRAME_MINT_MIN_ADVERTISERS:-2}
      AGF_FUNNEL_DEEP_PAGES: ${AGF_FUNNEL_DEEP_PAGES:-100}
      AGF_FUNNEL_DEEP_EVERY_DAYS: ${AGF_FUNNEL_DEEP_EVERY_DAYS:-7}
      # Watchdog/healthcheck staleness budget (worker default: max(this, 2×sweep
      # interval + 300)). Bump via .env when a long backfill shares the box and
      # legitimately slows stages past the budget.
      AGF_HEALTHCHECK_MAX_STALE_SEC: ${AGF_HEALTHCHECK_MAX_STALE_SEC:-3600}
    healthcheck:
      test: ["CMD", "python", "-m", "agf.workers.main", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  cron:
    image: europe-west1-docker.pkg.dev/peon-489013/agf/worker:latest
    restart: unless-stopped
    init: true
    entrypoint: >
      /bin/sh -c "env >> /etc/environment && crontab /app/ops/prod/crontab && cron -f"
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AGF_TRIAGE_EMBED_PER_CYCLE: ${AGF_TRIAGE_EMBED_PER_CYCLE:-200}
    depends_on:
      cloud-sql-proxy:
        condition: service_started

  # Continuous enrich consumer: drains public.pipeline_jobs (kind='enrich') that the
  # worker tick enqueues, running enrich_one per advertiser as a subprocess (crash
  # isolation) with SKIP-LOCKED claim + lease/reaper crash recovery. Needs the full
  # enrich environment (Meta extractor via proxies, Gemini, S3). Separate from the
  # on-demand `enrich` daemon (public.enrich_jobs), which stays untouched.
  pipeline:
    image: europe-west1-docker.pkg.dev/peon-489013/agf/worker:latest
    restart: unless-stopped
    init: true
    command: python -m agf.enrich_full.pipeline_daemon
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      AGF_ENRICH_ONE_TIMEOUT_SEC: ${AGF_ENRICH_ONE_TIMEOUT_SEC:-180}
      AGF_PIPELINE_POLL_SEC: ${AGF_PIPELINE_POLL_SEC:-5}
    depends_on:
      cloud-sql-proxy:
        condition: service_started

volumes:
  minio_data:
