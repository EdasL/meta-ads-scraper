# Field Desk — PRODUCTION stack (master-plan §3.10: this file is the single source
# for PG/MinIO image tags + creds; db/docker-compose.yml is local-test only).
# All credentials come from the environment (see ops/.env.example). 6 services.
# (Proxies are in-process via AGF_PROXIES — there is no proxy gateway container.)
name: field-desk

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready';"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

  api:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    command: uvicorn agf.api.asgi:app --host 0.0.0.0 --port 8000
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    # the real warm→discover→(score)→enrich loop (agf.workers.main). Set AGF_DRY_RUN=1
    # to smoke the wiring with the in-process fake extractor (zero Meta traffic).
    command: python -m agf.workers.main
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      # sweep caps so a real run can't hammer Meta (all have in-code defaults)
      AGF_DRY_RUN: ${AGF_DRY_RUN:-}
      AGF_EU_COUNTRIES: ${AGF_EU_COUNTRIES:-DE,GB}
      AGF_EU_MAX_PAGES: ${AGF_EU_MAX_PAGES:-3}
      AGF_ENRICH_LIMIT: ${AGF_ENRICH_LIMIT:-10}
      AGF_ENRICH_TTL_HOURS: ${AGF_ENRICH_TTL_HOURS:-168}
      AGF_SCORE_AFTER_SWEEP: ${AGF_SCORE_AFTER_SWEEP:-}
      AGF_SWEEP_INTERVAL_SEC: ${AGF_SWEEP_INTERVAL_SEC:-3600}
    healthcheck:
      # the loop writes a heartbeat each sweep; --healthcheck fails if it goes stale
      # (catches a hung/crash-looping worker that `restart` alone would mask).
      test: ["CMD", "python", "-m", "agf.workers.main", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  cron:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "crontab /app/ops/cron/crontab && cron -f"
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # NOTE: there is no proxy gateway container. Proxies are configured IN-PROCESS — the
  # worker reads AGF_PROXIES and routes Meta requests through them via ProxyPool/curl_cffi
  # (src/agf/extract/proxy.py). Set AGF_PROXIES in ops/.env (residential, sticky sessions);
  # verify with `scripts/check_proxies.py`. A centralized egress gateway would be a separate,
  # deliberate addition — the old placeholder service was a no-op and was removed.

volumes:
  pg_data:
  minio_data:
