# Field Desk — PRODUCTION stack (master-plan §3.10: this file is the single source
# for PG/MinIO image tags + creds; db/docker-compose.yml is local-test only).
# All credentials come from the environment (see ops/.env.example). 7 services.
name: field-desk

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready';"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

  api:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    command: uvicorn agf.api.asgi:app --host 0.0.0.0 --port 8000
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    command: python -m agf.discovery.run_discovery        # discovery + enrich + snapshot loop
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      proxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  cron:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "crontab /app/ops/cron/crontab && cron -f"
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: alpine:3.20
    restart: unless-stopped
    # residential-proxy gateway (forwards worker traffic through AGF_PROXIES). The
    # config template lives in ops/proxy/gateway.conf; swap alpine for your gateway image.
    command: ["sh", "-c", "echo 'proxy gateway: configure AGF_PROXIES upstreams (see ops/proxy/gateway.conf)'; sleep infinity"]
    environment:
      AGF_PROXIES: ${AGF_PROXIES}
    volumes:
      - ./proxy/gateway.conf:/etc/agf/gateway.conf:ro

volumes:
  pg_data:
  minio_data:
