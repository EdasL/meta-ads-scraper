# Field Desk — PRODUCTION stack (master-plan §3.10: this file is the single source
# for PG/MinIO image tags + creds; db/docker-compose.yml is local-test only).
# All credentials come from the environment (see ops/.env.example). 6 runtime
# services (api = the Go backend/; + an optional api-py FastAPI fallback profile).
# (Proxies are in-process via AGF_PROXIES — there is no proxy gateway container.)
name: field-desk

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready';"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

  # The read-only HTTP API is now the Go service (backend/). It is a second
  # client of this same Postgres + MinIO; the Python worker/cron/scoring and all
  # migrations are unchanged. Schema stays Python-owned — the Go service never
  # migrates, it only reads (and writes the single review-decision row).
  api:
    build: { context: ../backend, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_CORS_ORIGINS: ${AGF_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ROLLBACK fallback: the original Python FastAPI, identical contract on :8000.
  # Disabled by default. To revert the cutover, stop `api` and run:
  #   docker compose --profile fallback up -d api-py
  # Kept until the Go cutover has run in production for a cycle, then removed.
  api-py:
    profiles: ["fallback"]
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    command: uvicorn agf.api.asgi:app --host 0.0.0.0 --port 8000
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    # the real warm→discover→(score)→enrich loop (agf.workers.main). Set AGF_DRY_RUN=1
    # to smoke the wiring with the in-process fake extractor (zero Meta traffic).
    command: python -m agf.workers.main
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      # Object store: defaults to the local MinIO creds; set S3_ACCESS_KEY /
      # S3_SECRET_KEY (+ S3_ENDPOINT=https://storage.googleapis.com,
      # S3_REGION=<bucket-location>) to point at GCS via its S3-compat HMAC API
      # (prod). boto3 in src/agf/storage/s3.py handles both.
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      # sweep caps so a real run can't hammer Meta (all have in-code defaults)
      AGF_DRY_RUN: ${AGF_DRY_RUN:-}
      AGF_SWEEP_PAGES: ${AGF_SWEEP_PAGES:-2}
      AGF_KW_DELAY: ${AGF_KW_DELAY:-3.0}
      AGF_DISCOVERY_ENRICH_BUDGET: ${AGF_DISCOVERY_ENRICH_BUDGET:-600}
      AGF_ENRICH_TTL_HOURS: ${AGF_ENRICH_TTL_HOURS:-168}
      AGF_SCORE_AFTER_SWEEP: ${AGF_SCORE_AFTER_SWEEP:-}
      AGF_SWEEP_INTERVAL_SEC: ${AGF_SWEEP_INTERVAL_SEC:-3600}
      # advertisers whose ad media is repaired per loop tick; 5 (code default)
      # couldn't keep pace as the feed grew to ~900 products — bumped so the
      # textless backlog drains and stays caught up (media_repair self-limits
      # once the gap closes: the textless query returns fewer rows).
      AGF_MEDIA_REPAIR_PER_CYCLE: ${AGF_MEDIA_REPAIR_PER_CYCLE:-12}
    healthcheck:
      # the loop writes a heartbeat each sweep; --healthcheck fails if it goes stale
      # (catches a hung/crash-looping worker that `restart` alone would mask).
      test: ["CMD", "python", "-m", "agf.workers.main", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # On-demand "Refresh data": claims 'queued' public.enrich_jobs rows (inserted
  # by the Go API, which runs in a pod with no Python) and runs the one-shot
  # enrichment CLI for each. Same image + env as the worker.
  enrich:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    init: true
    command: python -m agf.enrich_full.queue_daemon
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
      AGF_PROXIES: ${AGF_PROXIES}
      AGF_FUNNEL_PROXY: ${AGF_FUNNEL_PROXY:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  cron:
    build: { context: .., dockerfile: ops/Dockerfile }
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "crontab /app/ops/cron/crontab && cron -f"
    environment:
      AGF_DATABASE_URL: ${AGF_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # NOTE: there is no proxy gateway container. Proxies are configured IN-PROCESS — the
  # worker reads AGF_PROXIES and routes Meta requests through them via ProxyPool/curl_cffi
  # (src/agf/extract/proxy.py). Set AGF_PROXIES in ops/.env (residential, sticky sessions);
  # verify with `scripts/check_proxies.py`. A centralized egress gateway would be a separate,
  # deliberate addition — the old placeholder service was a no-op and was removed.

volumes:
  pg_data:
  minio_data:
