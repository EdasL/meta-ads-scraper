# Field Desk — residential-proxy gateway template (master-plan §3.10).
#
# The worker sends all Meta Ad Library traffic through a rotating/sticky residential
# (or static ISP) proxy. Upstreams come from the single env contract AGF_PROXIES
# (newline/comma list of user:pass@host:port) — the same contract Plan 2 ProxyPool
# reads. Pin ONE residential IP per warm session for its lifetime; never rotate a
# warm session's IP mid-flight (see docs/research/2026-06-04-server-side-extraction.md §3/§5).
#
# This is a template: render it for your gateway (e.g. a forward proxy) at deploy time
# by expanding AGF_PROXIES into upstream entries. Pull bulky creative bytes (fbcdn)
# OUTSIDE the residential proxy to keep residential GB on the light GraphQL JSON.
#
# Example (one upstream per AGF_PROXIES entry):
#   upstream meta_residential {
#       # for each user:pass@host:port in AGF_PROXIES:
#       server <host>:<port>;          # auth via Proxy-Authorization from user:pass
#   }
#
# Env:
#   AGF_PROXIES = user:pass@host1:port1, user:pass@host2:port2, ...
