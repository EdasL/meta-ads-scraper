apiVersion: apps/v1
kind: Deployment
metadata:
  name: agf-web
  namespace: agf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agf-web
  template:
    metadata:
      labels:
        app: agf-web
    spec:
      containers:
        - name: web
          image: europe-west1-docker.pkg.dev/peon-489013/agf/web:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: agf-web-secrets
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTH_URL
              value: "https://peon.works"
            - name: NEXTAUTH_URL
              value: "https://peon.works"
            - name: AUTH_TRUST_HOST
              value: "true"
            # Server-only: the web app's SSR/proxy/server-actions reach the Go API
            # in-cluster and add the internal token + X-User-Email. AGF_API_TOKEN
            # is injected via envFrom agf-web-secrets (same value as the API pod).
            - name: AGF_API_INTERNAL_URL
              value: "http://agf-api.agf.svc.cluster.local:8000/api"
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agf-web
  namespace: agf
spec:
  selector:
    app: agf-web
  ports:
    - port: 8080
      targetPort: 8080
